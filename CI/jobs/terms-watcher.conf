# jobs/terms-watcher.conf
# Monthly check of every live listing's own policy pages (DirectoryManager.TermsWatcher):
# compares the wording about KYC, countries served, VPN/Tor and fees with last month's.
# Unchanged = free. Changed wording is compared with the listing's data by the AI, capped by
# TermsWatcher:MonthlyAiCap (default 120 calls a month). NEVER edits a listing: findings wait on
# /admin/terms-watch. Uses the same root-only Anthropic key file as the submission reviewer.

PROJECT_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.TermsWatcher"
DLL_NAME="DirectoryManager.TermsWatcher.dll"

# Once a month: the 1st at 03:30 UTC. Persistent, so a run missed while the server was off
# happens at the next boot instead of being skipped for a whole month.
ON_CALENDAR="*-*-01 03:30:00 UTC"
SCHEDULE_DESCRIPTION="Monthly, on the 1st at 03:30 UTC"
TIMER_PERSISTENT=1

NEEDS_EMAIL=0
NEEDS_TOR=1

ENVIRONMENT_FILE="/etc/monerica-submission-reviewer/secrets.env"

MAX_RUNTIME="6h"

# Run the full test suite before deploying this job (deploy aborts if any test fails).
TEST_SOLUTION_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.sln"

# Runs as the isolated account: its firewall rule allows the public internet, the local
# database and Tor, and nothing else on this server (set up 2026-11-18).
JOB_USER="dm-fetch"
