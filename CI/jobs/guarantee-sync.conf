# jobs/guarantee-sync.conf
# Weekly sync of deposit guarantees held by OrangeFren (DirectoryManager.GuaranteeSync): reads
# https://orangefren.com/api/monerica/guarantees and updates the BTC amount on each matching
# listing's OrangeFren guarantee row (adds the row when a listed service newly appears).
# Never deletes a row and never touches a listing's other guarantees. No AI, no cost.
# Name mismatches are handled with GuaranteeSync:Aliases in appsettings.json.

PROJECT_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.GuaranteeSync"
DLL_NAME="DirectoryManager.GuaranteeSync.dll"

ON_CALENDAR="Mon *-*-* 04:10:00 UTC"
SCHEDULE_DESCRIPTION="Weekly, Mondays at 04:10 UTC"
TIMER_PERSISTENT=1

NEEDS_EMAIL=0
NEEDS_TOR=0

MAX_RUNTIME="10min"

# Run the full test suite before deploying this job (deploy aborts if any test fails).
TEST_SOLUTION_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.sln"
