# jobs/review-order-checker.conf
# AI pre-check of the order links on reviews waiting for moderation
# (DirectoryManager.ReviewOrderChecker). ADVISORY ONLY: it never approves, rejects, edits or tags
# a review; findings show on /admin/reviews/{id} for the moderator. This is NOT the old
# review-moderator job, which must never be scheduled.
# Opens order pages with the headless browser installed at /opt/monerica-order-render
# (Playwright venv + Chromium; onion links via Tor). Uses the same Anthropic key file as the
# submission reviewer; the key is in no repo file.

PROJECT_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.ReviewOrderChecker"
DLL_NAME="DirectoryManager.ReviewOrderChecker.dll"

# Every 10 minutes. Bill protection is in the app (ReviewOrderChecker:DailyCap / PerRunCap).
ON_CALENDAR="*:5/10:00 UTC"
SCHEDULE_DESCRIPTION="Every 10 minutes"

NEEDS_EMAIL=0
NEEDS_TOR=1

ENVIRONMENT_FILE="/etc/monerica-submission-reviewer/secrets.env"

MAX_RUNTIME="10min"

# Run the full test suite before deploying this job (deploy aborts if any test fails).
TEST_SOLUTION_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.sln"

# Runs as the isolated account: its firewall rule allows the public internet, the local
# database and Tor, and nothing else on this server (set up 2026-11-18).
JOB_USER="dm-fetch"
# Starts the page-reading browser through sudo as the second, tighter account (order-render).
NEEDS_SUDO=1
