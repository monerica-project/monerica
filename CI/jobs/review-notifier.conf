# jobs/review-notifier.conf
# Emails listing owners once when a new review or non-owner reply on their listing goes live.

PROJECT_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.ReviewNotifier"
DLL_NAME="DirectoryManager.ReviewNotifier.dll"

# Every 5 minutes. Low volume; the outbox makes each send once-only + retryable.
ON_CALENDAR="*:0/5:00 UTC"
SCHEDULE_DESCRIPTION="Every 5 minutes"

NEEDS_EMAIL=1
NEEDS_TOR=0

MAX_RUNTIME="10min"
