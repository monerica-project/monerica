# jobs/submission-reviewer.conf
# AI-assisted review of Pending submissions (DirectoryManager.SubmissionReviewer). Never publishes:
# results wait on /admin/submission-review. Also sends drafts left in Preview for 24h+ to review.
# The Anthropic API key is NOT in any repo file: it lives in a root-only file on the server
# (/etc/monerica-submission-reviewer/secrets.env, Anthropic__ApiKey=...), loaded by systemd.

PROJECT_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.SubmissionReviewer"
DLL_NAME="DirectoryManager.SubmissionReviewer.dll"

# Every 10 minutes. Bill protection is in the app (SubmissionReviewer:DailyCap / PerRunCap).
ON_CALENDAR="*:0/10:00 UTC"
SCHEDULE_DESCRIPTION="Every 10 minutes"

NEEDS_EMAIL=0
NEEDS_TOR=1

ENVIRONMENT_FILE="/etc/monerica-submission-reviewer/secrets.env"

MAX_RUNTIME="10min"

# Run the full test suite before deploying this job (deploy aborts if any test fails).
TEST_SOLUTION_SOURCE_PATH="../src/DirectoryManager/DirectoryManager.sln"
